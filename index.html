<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW E92 M3 - The Ultimate Driving Machine</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #d4af37;
            --accent-blue: #0066bf;
            --text-main: #f0f4f8;
            --text-sub: #94a3b8;
            --border-color: #2a3441;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .hero-image {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid var(--border-color);
        }

        .content {
            padding: 40px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #0066bf, #e01921);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            padding: 6px 14px;
            border-radius: 30px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-sub);
            margin-bottom: 35px;
            font-weight: 400;
            border-left: 3px solid var(--accent-color);
            padding-left: 12px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }
